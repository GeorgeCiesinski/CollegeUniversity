# ITS theme libraries.
# global is attached from its.info.yml (every page). page.* libraries
# are attached in its.theme by node bundle or path.

global:
  vite: true
  css:
    theme:
      src/scss/global.scss: {}
  js:
    src/js/global.js: { attributes: { type: module } }
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/jquery
    - core/once

