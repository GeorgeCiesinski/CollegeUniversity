name: ITS
type: theme
'base theme': stable9
libraries:
  - its/global
  - core/normalize
libraries-extend:
  user/drupal.user:
    - its/user
  core/drupal.dialog:
    - its/dialog
  file/drupal.file:
    - its/file
  core/drupal.progress:
    - its/progress
libraries-override:
  slick/base:
    css:
      layout:
        css/layout/slick.module.css: overrides/slick-module.css
  slick/slick.theme:
    css:
      theme:
        css/theme/slick.theme.css: overrides/slick-theme.css
  system/base:
    css:
      component:
        /core/themes/stable9/css/system/components/fieldgroup.module.css: overrides/fieldgroup.css
core_version_requirement: ^10
generator: 'starterkit_theme:10.1.2'
regions:
  header: Header
  primary_menu: 'Primary menu'
  secondary_menu: 'Secondary menu'
  breadcrumb: Breadcrumb
  highlighted: Highlighted
  background_image: 'Background image'
  help: Help
  content: Content
  sidebar_first: 'Left sidebar'
  sidebar_second: 'Right sidebar'
  footer: Footer
