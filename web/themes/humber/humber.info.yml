name: humber
type: theme
'base theme': stable9
starterkit: true
# version: VERSION
libraries:
  - humber/base
  - humber/messages
  - core/normalize
libraries-extend:
  user/drupal.user:
    - humber/user
  core/drupal.dropbutton:
    - humber/dropbutton
  core/drupal.dialog:
    - humber/dialog
  file/drupal.file:
    - humber/file
  core/drupal.progress:
    - humber/progress
libraries-override: 
  slick/base:
    css:
      layout:
        css/layout/slick.module.css: css/layout/slick-module.css
  slick/slick.theme:
    css:
      theme:
        css/theme/slick.theme.css: css/theme/slick-theme.css
  system/base:
    css:
      component:
        /core/themes/stable9/css/system/components/fieldgroup.module.css: css/components/fieldgroup.css
core_version_requirement: ^10
generator: 'starterkit_theme:10.1.2'
