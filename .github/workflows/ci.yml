name: CI

on:
  pull_request:
    branches:
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [format, lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/themes/its/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web/themes/its

      - name: Run ${{ matrix.task }}
        run: npm run ${{ matrix.task }} --prefix web/themes/its

  build:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/themes/its/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web/themes/its

      - name: Build theme assets
        run: npm run build --prefix web/themes/its
