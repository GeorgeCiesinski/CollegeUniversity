id: node.quick_action.field_weight
field_name: field_weight
entity_type: node
bundle: quick_action
label: Weight
description: "The weight is how quick actions are sorted. Lower weight items appear before higher weight items. When assigning a weight to an item, it is recommended to space them out a bit. If you have 3 items with the weights 1, 2 and 3 and want to insert a fourth item somewhere between those, then you would have to first edit these items to make space for the fourth. Instead, if you number those items 10, 20, and 30, then you have plenty of space between the existing items and don't have to edit them first."
required: true
