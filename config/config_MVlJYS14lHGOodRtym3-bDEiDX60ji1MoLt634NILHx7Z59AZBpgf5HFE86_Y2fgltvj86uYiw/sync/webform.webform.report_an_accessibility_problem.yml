id: report_an_accessibility_problem
title: 'Report a Problem with the Website'
description: '<p>Form to report issues on the website.</p>'
categories: {  }
elements: |-
  problem_type:
    '#type': checkboxes
    '#title': Category
    '#help': '<p>What kind of a problem did you experience on the page?</p>'
    '#options':
      Accessibility: "Accessibility -- Element or page doesn't meet accessibility guidelines."
      'Broken Link': 'Broken Link -- One or more link is not working or results in Page not found (404 error).'
      Content: 'Content -- Outdated or incorrect information, typo, or missing content/images.'
      Layout: 'Layout -- Layout is overlapping or misaligned.'
      Performance: 'Performance -- Slow loading time, crashing, or freezing.'
      Other: "Other -- Problem that doesn't fall under the listed categories."
    '#required': true
  information:
    '#type': fieldset
    '#title': Information
    '#description': '<p><strong>IMPORTANT: This form is for reporting website related issues to the web developer.&nbsp;</strong></p><p>Do not submit support requests (login issues, access to Portal or Blackboard) as these will be deleted.</p><p>Please visit the <a href="/its/contact">Contact</a> page or click the Chat Now button to speak to an agent.</p>'
    page_url:
      '#type': url
      '#title': 'Page URL'
      '#help': '<p>Link to the page where the problem occurred. This field is automatically filled.&nbsp;</p>'
      '#prepopulate': true
    description:
      '#type': textarea
      '#title': Description
      '#help': '<p>Describe the problem in as much detail as possible.</p>'
      '#required': true
  acknowledgement:
    '#type': checkboxes
    '#title': Acknowledgement
    '#options':
      'I understand that this form is for submitting website problems, not to request tech support.': 'I understand that this form is for submitting website problems, not to request tech support.'
      'I understand that requests for support such as login issues, or inability to access other sites like Portal and Blackboard, will be deleted.': 'I understand that requests for support such as login issues, or inability to access other sites like Portal and Blackboard, will be deleted.'
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#states':
      enabled:
        ':input[name="acknowledgement[I understand that this form is for submitting website problems, not to request tech support.]"]':
          checked: true
        ':input[name="acknowledgement[I understand that requests for support such as login issues, or inability to access other sites like Portal and Blackboard, will be deleted.]"]':
          checked: true
